<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mon Plan Santé — Repas & Split.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plan Santé">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=44">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=44">
  <title>Mon Plan Santé</title>
  <script>try{var t=localStorage.getItem('mon-plan-sante-apparence');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" data-day="on">
  <!-- EN-TÊTE APPLE LARGE TITLE -->
  <header class="top">
    <div class="wrap">
      <div class="top-bar">
        <div class="top-title">
          <div class="date" id="date">Aujourd'hui</div>
          <h1 id="screenTitle">Repas</h1>
        </div>
        <div class="top-actions">
          <button type="button" class="phase-pill" id="phaseToggleBtn" title="Basculer Cut / Maintien"></button>
        </div>
      </div>

      <!-- Carte du cycle -->
      <section class="card today" id="cycBar" aria-label="Mon cycle">
        <div class="today-top">
          <div class="today-txt">
            <span class="today-lab" id="todayLab"></span>
            <strong class="today-name" id="todayName"></strong>
          </div>
          <span class="pill" id="todayPill"></span>
        </div>
        <div class="strip" id="strip" role="group" aria-label="Jours du cycle"></div>
        <div class="today-acts" id="todayActs">
          <button type="button" class="mini-act" id="shiftBtn">Décaler d’un jour</button>
          <button type="button" class="mini-act" id="changeDayBtn">Changer le jour</button>
        </div>
        <button type="button" class="ghost-btn" id="backBtn" hidden></button>
      </section>
    </div>
  </header>

  <main class="wrap">
    <!-- ==================================================================
         ONGLET 1 : REPAS (Résumé macros & Les 3 repas avec copie Foodvisor)
         ================================================================== -->
    <section class="view" id="view-repas" aria-label="Repas du jour">
      <section class="card summary" aria-label="Résumé du jour">
        <div class="sum-top">
          <div class="kcal-block">
            <span class="kcal" id="kcal">—</span>
            <span class="kcal-unit" id="kcalTarget">/ — kcal</span>
          </div>
          <span class="eaten-pill" id="kcalDiff">Chargement…</span>
        </div>
        <div class="bar" aria-hidden="true">
          <span id="barP" style="background:var(--mac-p)"></span>
          <span id="barG" style="background:var(--mac-g)"></span>
          <span id="barL" style="background:var(--mac-l)"></span>
        </div>
        <dl class="macros">
          <div class="macro"><dt><span class="dot" style="background:var(--mac-p)"></span>Protéines</dt><dd id="mP">—</dd></div>
          <div class="macro"><dt><span class="dot" style="background:var(--mac-g)"></span>Glucides</dt><dd id="mG">—</dd></div>
          <div class="macro"><dt><span class="dot" style="background:var(--mac-l)"></span>Lipides</dt><dd id="mL">—</dd></div>
          <div class="macro"><dt><span class="dot" style="background:var(--mac-f)"></span>Fibres</dt><dd id="mFib">—</dd></div>
        </dl>
        <div class="progress">
          <div class="progress-row">
            <span id="doneCount">0 / 3 repas mangés</span>
            <span id="eaten">0 / — kcal</span>
          </div>
          <div class="track"><span id="eatenBar"></span></div>
        </div>
        <div class="sum-actions" id="resetQtyRow" hidden>
          <small class="hint">Grammes personnalisés</small>
          <button type="button" class="link-btn" id="resetQty">Remettre auto</button>
        </div>
      </section>

      <div class="callout is-warn" id="floorNote" hidden></div>
      <div class="view" id="meals"></div>

      <!-- Valeurs nutritionnelles pour 100 g (replié) -->
      <details class="card fold">
        <summary>
          <span>Valeurs des aliments (pour 100 g)</span>
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <div class="fold-body">
          <div class="ref" id="foodRef"></div>
          <div class="btn-row">
            <button type="button" class="ghost-btn" id="exportFoodsBtn">Exporter foods.json</button>
            <button type="button" class="ghost-btn is-danger" id="resetFoods" hidden>Revenir aux valeurs par défaut</button>
          </div>
        </div>
      </details>

      <button type="button" class="card copy-split-btn" id="copyMealsBtn">
        <span class="copy-split-txt">
          <strong>Copier tous les repas</strong>
          <small>Cut &amp; Maintien · Jours ON et OFF</small>
        </span>
        <span class="copy-split-ic" aria-hidden="true">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
      </button>
    </section>

    <!-- ==================================================================
         ONGLET 2 : SPLIT (Exercices, Récupération & Charges)
         ================================================================== -->
    <section class="view" id="view-seance" aria-label="Split d'entraînement" hidden>
      <!-- Jour ON : Séance -->
      <div class="view" id="sessionBox">
        <section class="card sess" aria-label="Avancement de la séance">
          <div class="progress-row">
            <span>Séries validées<span class="tag warn" id="deloadTag" hidden>Deload</span></span>
            <b id="setCount">0 / 16</b>
          </div>
          <div class="track"><span id="setBar" class="on-bar"></span></div>
        </section>

        <div class="view" id="exList"></div>

        <section class="card panel" aria-label="Mode deload">
          <button type="button" class="switch-row" id="deloadBtn" role="switch" aria-checked="false">
            <span>
              <strong id="deloadTitle">Mode deload</strong>
              <small id="deloadText">2 séries / exercice · RIR 4 poly / RIR 3 iso</small>
            </span>
            <span class="switch" aria-hidden="true"><i></i></span>
          </button>
        </section>
      </div>

      <!-- Jour OFF : Récupération active -->
      <div class="view" id="recoveryBox" hidden>
        <div class="card list-card" id="recList"></div>
      </div>

      <!-- Carnet de charges complet (replié) -->
      <details class="card fold">
        <summary>
          <span id="loadsSummaryTitle">Mes charges</span>
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <div class="fold-body" id="loadsSummary"></div>
      </details>

      <button type="button" class="card copy-split-btn" id="copySplitBtn">
        <span class="copy-split-txt">
          <strong>Copier tout le split</strong>
          <small>Séances A/B/C/D, charges &amp; récup</small>
        </span>
        <span class="copy-split-ic" aria-hidden="true">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
      </button>
    </section>

    <!-- ==================================================================
         ONGLET 3 : COURSES (4 / 8 / 10 jours & Liste à cocher)
         ================================================================== -->
    <section class="view" id="view-courses" aria-label="Courses" hidden>
      <div class="seg three" role="group" aria-label="Durée des courses">
        <button type="button" data-shop="4" aria-pressed="false">4 jours</button>
        <button type="button" data-shop="8" aria-pressed="true">8 jours</button>
        <button type="button" data-shop="10" aria-pressed="false">10 jours</button>
      </div>

      <section class="card cart-sum">
        <div class="cart-top">
          <span id="cartBasis">Dans le panier</span>
          <span class="cart-count" id="cartCount">0 / 14</span>
        </div>
        <div class="track cart-track"><span id="cartBar"></span></div>
        <div class="cart-foot" id="cartResetRow" hidden>
          <button type="button" class="link-btn" id="resetCart">Tout décocher</button>
        </div>
      </section>

      <div class="view" id="groups"></div>
    </section>
  </main>

  <!-- TOAST DE CONFIRMATION DISCRET -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- MINUTEUR DE REPOS FLOTTANT (DYNAMIC ISLAND) -->
  <div class="timer" id="timer" hidden>
    <div class="wrap">
      <div class="timer-box">
        <div class="timer-row">
          <div class="timer-txt"><span id="timerLabel" role="status">Repos</span><b id="timerTime">0:00</b></div>
          <div class="timer-acts">
            <button type="button" class="timer-add" id="timerAdd">+30 s</button>
            <button type="button" class="timer-skip" id="timerSkip">Passer</button>
          </div>
        </div>
        <div class="timer-track"><span id="timerBar"></span></div>
      </div>
    </div>
  </div>

  <!-- BARRE DE NAVIGATION iOS GLASS (3 ONGLETS : Repas, Split & Courses) -->
  <nav class="tabs" aria-label="Navigation">
    <div class="wrap">
      <button type="button" class="tab" data-tab="repas" aria-current="page">
        <span class="tab-ic"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.6"/></svg></span>Repas
      </button>
      <button type="button" class="tab" data-tab="seance">
        <span class="tab-ic"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg></span>Split
      </button>
      <button type="button" class="tab" data-tab="courses">
        <span class="tab-ic"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4.5h2.4l2.1 10.5h10.5l2.2-7H7"/><circle cx="9.5" cy="19.2" r="1.3"/><circle cx="17" cy="19.2" r="1.3"/></svg></span>Courses
      </button>
    </div>
  </nav>
</div>

<script src="nutritionEngine.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadSW || reloaded) return;
      reloaded = true;
      location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
}
</script>
</body>
</html>
